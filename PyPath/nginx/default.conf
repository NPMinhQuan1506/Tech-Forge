resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 8000;
    server_name _;
    client_max_body_size 6m;

    location /static/ {
        # Django collects versioned application assets into the shared volume.
        # Nginx serves these directly instead of sending CSS through Gunicorn.
        alias /static/;
        access_log off;
        expires 7d;
    }

    location / {
        # Resolve through Docker DNS at request time so a restarted Django
        # container does not require an Nginx reload.
        set $django_upstream django;
        proxy_pass http://$django_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 70s;
    }
}

server {
    listen 8001;
    server_name _;
    client_max_body_size 6m;

    location / {
        # /docs, /openapi.json, and the OCR grading endpoint are all exposed
        # through this localhost-only listener.
        set $ocr_upstream ocr-service;
        proxy_pass http://$ocr_upstream:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }
}
